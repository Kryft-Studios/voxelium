<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Voxelium</title>

    <style>
        :root {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #fff;
            background: #101114;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            user-select: none;

            background:
                radial-gradient(circle at 50% 35%,
                    #20232b 0%,
                    #14161b 45%,
                    #0d0e11 100%);
        }

        .loading {
            width: 100vw;
            height: 100vh;

            padding: 32px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: 18px;

            border: 1px solid #2d3038;
            border-radius: 16px;

            background: rgba(20, 22, 27, 0.92);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(16px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
        }

        .logo-text {
            font-size: 21px;
            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .loading-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            color: #a7abb5;
            font-size: 14px;
        }

        .spinner {
            width: 18px;
            height: 18px;

            border: 2px solid #343741;
            border-top-color: #f97316;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        #progress {
            width: min(500px, 80vw);
            height: 8px;

            appearance: none;
            -webkit-appearance: none;

            border: none;
            border-radius: 999px;

            overflow: hidden;

            background: #292c33;
        }

        #progress::-webkit-progress-bar {
            background: #292c33;
            border-radius: 999px;
        }

        #progress::-webkit-progress-value {
            background: #f97316;
            border-radius: 999px;

            transition: width 180ms ease;
        }

        .progress-info {
            width: min(500px, 80vw);

            display: flex;
            justify-content: space-between;

            color: #777c87;
            font-size: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #stop-button {
            margin-top: 4px;

            padding: 8px 18px;

            border: 1px solid #3a3d46;
            border-radius: 8px;

            background: #24272e;
            color: #d7d9df;

            font-family: inherit;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 120ms ease,
                border-color 120ms ease,
                transform 80ms ease;
        }

        #stop-button:hover {
            background: #2e323a;
            border-color: #4a4e59;
        }

        #stop-button:active {
            transform: scale(0.97);
        }

        #stop-button:disabled {
            opacity: 0.5;
            cursor: default;
        }
    </style>
</head>

<body>

    <div class="loading">

        <div class="logo">
            <img class="logo-icon" src="/VoxeliumLogo.png"></img>
            <div class="logo-text">Voxelium</div>
        </div>

        <div class="loading-row">
            <div class="spinner"></div>

            <div class="status">
                Loading
            </div>
        </div>

        <progress id="progress" value="0" max="2074">
        </progress>
        <button id="stop-button">Stop</button>
        <p id="debug"></p>
    </div>

    <script>
        const progress = document.getElementById("progress");
        const status = document.querySelector(".status");
        const stopButton = document.getElementById("stop-button");

        globalThis.setProgress = function setProgress(current, total, message = "Loading") {
            progress.max = total;
            progress.value = current;
            status.textContent = message;
        }
        globalThis.setStopped = function setStopped() {
            stopButton.disabled = true;
            status.textContent = "Stopping...";
        };
        const { ipcRenderer } = require("electron");

        stopButton.addEventListener("click", () => {
            globalThis.setStopped();
            ipcRenderer.send("loading-stop")
        });
    </script>

</body>

</html>
